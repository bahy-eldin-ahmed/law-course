          curl -fsSL --retry 3 -o videos/v07.mp4 https://litter.catbox.moe/hxfqfl.mp4
          echo 'dbf085af027d396ed4883fbc2adb5b693d933260fe2d53587680f0cf5819c5b1  videos/v07.mp4' | sha256sum -c -
