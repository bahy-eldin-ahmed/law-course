name: deploy-content
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch files
        run: |
          set -e
          mkdir -p videos
          curl -fsSL --retry 3 -o index.html https://litter.catbox.moe/cg3ooz.html
          echo 'e5e83d50bb007cd8553279e7e5f38311ba42fbabafd99ea92de336be4f33f9ec  index.html' | sha256sum -c -
          curl -fsSL --retry 3 -o data.js https://litter.catbox.moe/60tem3.js
