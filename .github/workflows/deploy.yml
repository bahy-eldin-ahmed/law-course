          echo '44bdad4a98ee0972a5d19c7f949e18fe241d2591cbd5a05deb6a4b248ceea1e4  videos/v02.mp4' | sha256sum -c -
          curl -fsSL --retry 3 -o videos/v03.mp4 https://litter.catbox.moe/da0t6k.mp4
          echo 'a1c96459497f99c74b77b287e6ba0824f08d3ea6d178ec195cb3244b3889fdc0  videos/v03.mp4' | sha256sum -c -
          curl -fsSL --retry 3 -o videos/v04.mp4 https://litter.catbox.moe/sw7z6l.mp4
