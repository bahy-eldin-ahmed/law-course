name: add-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o maktaba.apk https://litter.catbox.moe/nvy7yh.apk
          echo "0d5f86d49c7cd9e5a18aab21ca56bbfe0b874c30f786f175d623a1a6bd0517af  maktaba.apk" | sha256sum -c -
          git rm -q .github/workflows/add-apk.yml
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add maktaba.apk
          git commit -m "Add APK"
          git push
