name: add-apk
on: workflow_dispatch
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o maktaba.apk https://litter.catbox.moe/ad05ve.apk
          echo "1ec695b348b6677f3e9d2172c260d597dfdd0e168345c602facea17c44dcb610  maktaba.apk" | sha256sum -c -
          git rm -q .github/workflows/add-apk.yml
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add maktaba.apk
          git commit -m "Update APK"
          git push
